version: '3.9'

services:
  evently.database:
    image: postgres:latest
    container_name: Evently.Database
    environment:
      - POSTGRES_DB=evently
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports: # 5432 is used by local machine postgres
      - 5400:5432

  evently.seq:
    image: datalust/seq:latest
    container_name: Evently.Seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5341:5341 # default port where log is streamed to 
      - 8222:80 # for web UI
  evently.redis:
    image: redis:latest
    container_name: Evently.Redis
    restart: always
    ports:
      - 6300:6379


  evently.identity:
    image: quay.io/keycloak/keycloak:latest
    container_name: Evently.Identity
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files:/opt/keycloak/data/import
    ports:
      - 18080:8080
      - 9000:9000 # if you want to expose health check locally
  evently.jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: Evently.Jaeger
    ports:
      - 4317:4317 # default port for the OpenTelemetry gRPC receiver.
      - 4318:4318 # default port for the OpenTelemetry HTTP receiver
      - 16686:16686 # where UI is 

  evently.queue:
    image: rabbitmq:management-alpine
    container_name: Evently.Queue
    hostname: evently-queue
    volumes:
        - ./.containers/queue/data/:/var/lib/rabbitmq
        - ./.containers/queue/log/:/var/log/rabbitmq
    environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
    ports:
      - 5672:5672
      - 15672:15672


  evently.api:
    image: ${DOCKER_REGISTRY-}eventlyapi
    container_name: Evently.Api
    build:
      context: .
      dockerfile: src/API/Evently.Api/Dockerfile
    depends_on:
      - evently.database
      - evently.seq
      - evently.identity
      - evently.redis
      - evently.jaeger
    ports:
      - 5000:8080
      - 5001:8081
   
  evently.gateway:
    image: ${DOCKER_REGISTRY-}eventlygateway
    container_name: Evently.Gateway
    build:
       context: .
       dockerfile: src/API/Evently.Gateway/Dockerfile
    ports:
      - 3000:8080
      - 3001:8081
  
  evently.ticketing.api:
    image: ${DOCKER_REGISTRY-}eventlyticketingapi
    container_name: Evently.Ticketing.Api
    build:
      context: .
      dockerfile: src/API/Evently.Ticketing.Api/Dockerfile
    ports:
      - 5100:8080
      - 5101:8081
